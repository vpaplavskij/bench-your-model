[project]
name = "bench-your-model"
version = "0.1.0"
description = "Benchmark harness for local LLM servers (OpenAI-compatible API)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
