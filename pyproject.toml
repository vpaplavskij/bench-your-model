[project]
name = "bench-your-model"
version = "0.1.0"
description = "Benchmark harness for local LLM servers (OpenAI-compatible API)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (skipped by `pytest -m 'not slow'`)"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
